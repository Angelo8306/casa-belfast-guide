<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Casa Belfast 17 · Renovation Guide</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f6f1e7; --sand2:#efe7d8; --ink:#26221b; --ink2:#5c554a;
  --ochre:#a8763e; --ochre2:#8a5f2e; --line:#d9cfbc; --white:#fffdf9;
  --ok:#4d6b4f; --warn:#a04b2f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Archivo',sans-serif;background:var(--sand);color:var(--ink);line-height:1.65;
  background-image:radial-gradient(rgba(168,118,62,.05) 1px, transparent 1px);background-size:26px 26px}
h1,h2,h3,.serif{font-family:'Fraunces',serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
/* topbar */
.top{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:58px}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.brand em{color:var(--ochre);font-style:normal}
.langs{display:flex;gap:6px}
.langs button{border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;
  font-size:.78rem;padding:5px 12px;border-radius:99px;cursor:pointer;transition:.18s}
.langs button.on{background:var(--ink);color:var(--sand)}
/* hero */
.hero{padding:72px 0 40px}
.eyebrow{display:inline-block;font-weight:700;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ochre2);border:1.5px solid var(--ochre);border-radius:99px;padding:6px 14px;margin-bottom:22px}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:700;line-height:1.04;letter-spacing:-.01em}
.lede{max-width:640px;font-size:1.08rem;color:var(--ink2);margin-top:20px}
.hero .note{margin-top:26px;display:inline-flex;gap:10px;align-items:center;background:var(--white);
  border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-size:.88rem;color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* sections */
section{padding:54px 0;border-top:1px solid var(--line)}
.snum{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;color:var(--ochre);letter-spacing:.14em;margin-bottom:8px}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;line-height:1.15;margin-bottom:14px}
.sub{color:var(--ink2);max-width:680px;margin-bottom:26px}
/* tour */
.tour{border:2px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:10px 10px 0 rgba(38,34,27,.08)}
.tour iframe{width:100%;height:520px;display:block;border:0}
/* findings grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:var(--white);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:190px;object-fit:cover}
.card .pad{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.12rem}
.card p{font-size:.92rem;color:var(--ink2)}
.tag{align-self:flex-start;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 10px;border-radius:99px;background:var(--sand2);color:var(--ochre2)}
.tag.crit{background:#f3ded5;color:var(--warn)}
/* advice */
.advice{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media(max-width:820px){.advice{grid-template-columns:1fr}}
.quote{background:var(--ink);color:var(--sand);border-radius:16px;padding:26px 28px;font-family:'Fraunces',serif;
  font-size:1.25rem;line-height:1.45;position:relative}
.quote:before{content:"„";position:absolute;top:-8px;left:16px;font-size:4.4rem;color:var(--ochre);opacity:.85}
.quote .who{display:block;margin-top:14px;font-family:'Archivo',sans-serif;font-size:.78rem;letter-spacing:.14em;
  text-transform:uppercase;color:#b7ac99}
.steps{counter-reset:s}
.step{display:flex;gap:14px;margin-bottom:14px}
.step .n{counter-increment:s;flex:none;width:34px;height:34px;border-radius:50%;background:var(--ochre);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif}
.step .n:before{content:counter(s)}
.step p{font-size:.95rem}
.callout{background:var(--sand2);border-left:4px solid var(--ochre);border-radius:0 12px 12px 0;padding:16px 20px;
  margin-top:20px;font-size:.95rem}
/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.opts{grid-template-columns:1fr}}
.opt{background:var(--white);border:2px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.opt img{width:100%;height:300px;object-fit:cover;display:block}
.opt .oh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--ink);color:var(--sand)}
.opt .oh .ab{font-family:'Fraunces',serif;font-weight:700;color:var(--ochre);font-size:1.2rem}
.opt ul{list-style:none;padding:14px 18px 18px}
.opt ul li{font-size:.9rem;color:var(--ink2);padding-left:20px;position:relative;margin-bottom:6px}
.opt ul li:before{content:"✓";position:absolute;left:0;color:var(--ochre);font-weight:700}
.opt.sel{border-color:var(--ochre);box-shadow:0 0 0 3px rgba(168,118,62,.25)}
.opt .pick{position:absolute;top:12px;right:12px;background:var(--white);border:2px solid var(--ink);border-radius:99px;
  padding:5px 14px;font-size:.78rem;font-weight:700}
.opt.sel .pick{background:var(--ochre);border-color:var(--ochre);color:#fff}
.ist{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.ist img{width:110px;height:82px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
.ist span{font-size:.85rem;color:var(--ink2);font-style:italic}
.chiprow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{border:1.5px solid var(--ink);background:var(--white);border-radius:99px;padding:8px 18px;font:inherit;
  font-size:.88rem;font-weight:500;cursor:pointer;transition:.15s}
.chip.on{background:var(--ink);color:var(--sand)}
/* forms */
textarea,input[type=text]{width:100%;font:inherit;font-size:.92rem;background:var(--white);border:1.5px solid var(--line);
  border-radius:10px;padding:10px 14px;color:var(--ink);resize:vertical;min-height:44px}
textarea:focus,input:focus{outline:none;border-color:var(--ochre)}
.q{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:10px}
.q .qn{color:var(--ochre);font-family:'Fraunces',serif}
.comment-btn{background:none;border:none;color:var(--ochre2);font:inherit;font-size:.82rem;font-weight:700;
  cursor:pointer;margin-top:10px;text-decoration:underline;text-underline-offset:3px}
.cbox{margin-top:10px;display:none}
.cbox.open{display:block}
/* kommentar-chronologie */
.centry{display:flex;gap:10px;align-items:flex-start;background:var(--sand2);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:.88rem;cursor:pointer}
.centry .ct{color:var(--ink2);font-size:.7rem;white-space:nowrap;margin-top:3px;font-weight:700}
.centry.struck .cx{text-decoration:line-through;opacity:.5}
.chint{font-size:.72rem;color:var(--ink2);font-style:italic;margin-top:6px}
.crow{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.crow textarea{flex:1;min-height:42px}
/* checklist */
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:22px}
.citem{display:flex;gap:10px;align-items:center;background:var(--white);border:1.5px solid var(--line);
  border-radius:10px;padding:10px 14px;font-size:.9rem}
.citem .ic{color:var(--ok);font-weight:700}
/* fotos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.pitem{background:var(--white);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.pitem img{width:100%;height:110px;object-fit:cover;display:block}
.pitem .pt{font-size:.66rem;color:var(--ink2);padding:4px 8px 0;font-weight:700}
.pitem input{border:none;background:transparent;font-size:.78rem;padding:4px 8px 8px;min-height:auto}
.pitem .pdel{background:none;border:none;color:var(--warn);font-size:.7rem;font-weight:700;cursor:pointer;padding:0 8px 8px;text-decoration:underline}
.upzone{border:2px dashed var(--ochre);border-radius:14px;padding:26px;text-align:center;cursor:pointer;background:var(--white);transition:.15s}
.upzone:hover{background:var(--sand2)}
.upzone .big{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:700;color:var(--ochre2)}
/* sendbar */
.sendbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--ink);color:var(--sand)}
.sendbar .wrap{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.sendbar .cnt{font-size:.88rem;flex:1;min-width:180px}
.sendbar .cnt b{color:var(--ochre)}
.btn{font:inherit;font-weight:700;border-radius:99px;padding:10px 22px;cursor:pointer;border:2px solid transparent;transition:.15s}
.btn.wa{background:#39c05c;color:#fff;border-color:#39c05c}
.btn.ghost{background:transparent;color:var(--sand);border-color:var(--sand)}
.btn:hover{transform:translateY(-1px)}
footer{padding:50px 0 120px;color:var(--ink2);font-size:.88rem}
.reveal{opacity:0;transform:translateY(18px);transition:.6s ease}
.reveal.vis{opacity:1;transform:none}
.imgnote{font-size:.78rem;color:var(--ink2);font-style:italic;margin-top:10px}
</style>
</head>
<body>

      <button class="chip addbtn" data-add="a2" style="margin-top:auto"><span data-i="add"></span></button></div></div>
    <div class="card"><div class="pad"><span class="tag" data-i="t_idea"></span><h3 data-i="i3h"></h3><p data-i="i3"></p>
      <button class="chip addbtn" data-add="a3" style="margin-top:auto"><span data-i="add"></span></button></div></div>
    <div class="card"><div class="pad"><span class="tag" data-i="t_idea"></span><h3 data-i="i4h"></h3><p data-i="i4"></p>

const S = { lang: localStorage.getItem('cb17_lang') || 'en' };
const store = k => localStorage.getItem('cb17_' + k) || '';
const save = (k, v) => localStorage.setItem('cb17_' + k, v);

function applyLang() {
  const t = I[S.lang];
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-i]').forEach(el => { const k = el.getAttribute('data-i'); if (t[k] !== undefined) el.textContent = t[k]; });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === S.lang));
  updateCount();
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { S.lang = b.dataset.lang; localStorage.setItem('cb17_lang', S.lang); applyLang(); }));

// textareas
document.querySelectorAll('[data-store]').forEach(el => {
  el.value = store(el.getAttribute('data-store'));
  el.addEventListener('input', () => { save(el.getAttribute('data-store'), el.value); updateCount(); });
});
// comment toggles
document.querySelectorAll('.comment-btn').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.c).classList.toggle('open')));
// radios (chips + option cards)
document.querySelectorAll('[data-radio]').forEach(group => {
  const key = group.getAttribute('data-radio');
  const items = group.querySelectorAll('[data-v]');
  const cls = group.classList.contains('opts') ? 'sel' : 'on';
  const stored = store(key);
  items.forEach(it => {
    if (it.dataset.v === stored) it.classList.add(cls);
    it.addEventListener('click', () => {
      const was = it.classList.contains(cls);
      items.forEach(o => o.classList.remove(cls));
      if (!was) { it.classList.add(cls); save(key, it.dataset.v); } else { save(key, ''); }
      updateCount();
    });
  });
});

const KEYS = ['q1','q2','q3','q4','q5','q6','q7','q8','q8b','q9','q10','q11','q12','q13','q14','q15','q16','q17','q18','q19','q20','a1','a2','a3','a4','a5','a6'];
const ADD_TITLES = {a1:'i1h',a2:'i2h',a3:'i3h',a4:'i4h',a5:'i5h',a6:'i6h'};
const CKEYS = ['c_f1','c_f2','c_f3','c_f4','c_stone'];
function updateCount() {
  const n = KEYS.filter(k => store(k).trim() !== '').length;

function compile() {
  const t = I[S.lang];
  let out = t.wa_head + '\n';
  KEYS.forEach(k => { const v = store(k).trim(); if (!v) return;
    if (k.startsWith('a')) { out += '\n+ ' + t[ADD_TITLES[k]]; } else { out += '\n' + k.toUpperCase() + ': ' + v; } });
  CKEYS.forEach(k => { const a = logGet(k); a.forEach(e => { out += '\n[' + k + ' ' + fmtT(e.t) + (e.struck ? ' DURCHGESTRICHEN' : '') + ']: ' + e.text; }); });
  if (PHOTOS.length) out += '\n' + I[S.lang].wa_photos;

}

function buildPdfDom(){
  const t = I[S.lang];
  const w = document.createElement('div');
  w.style.cssText = 'font-family:Helvetica,Arial,sans-serif;color:#222;padding:6mm;width:190mm;background:#fff';

    else { const qk = t[k] || k.toUpperCase();
      h += '<div style="font-size:12px;margin:7px 0"><div style="font-weight:bold">' + qk + '</div><div>' + valLabel(t, v).replace(/</g,'&lt;') + '</div></div>'; } });
  CKEYS.forEach(k => { const a = logGet(k); if (!a.length) return;

// fotos (IndexedDB, verlustsicher auf dem Geraet)
const idb = { db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('cb17', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'});
    r.onsuccess = () => { idb.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(mode){ return idb.db.transaction('photos', mode).objectStore('photos'); },
  put(p){ return new Promise((res, rej) => { const q = idb.tx('readwrite').put(p); q.onsuccess = res; q.onerror = () => rej(q.error); }); },
  all(){ return new Promise((res, rej) => { const q = idb.tx('readonly').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); },
  del(id){ return new Promise((res, rej) => { const q = idb.tx('readwrite').delete(id); q.onsuccess = res; q.onerror = () => rej(q.error); }); } };
let PHOTOS = [];
function shrink(file){ return new Promise(res => { const img = new Image(); img.onload = () => {
  const M = 1200; let w = img.width, h = img.height; if (Math.max(w,h) > M) { const f = M/Math.max(w,h); w = Math.round(w*f); h = Math.round(h*f); }
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
  res(c.toDataURL('image/jpeg', .78)); }; img.src = URL.createObjectURL(file); }); }
async function renderPhotos(){ const t = I[S.lang]; const g = document.getElementById('pgrid'); g.innerHTML = '';
  PHOTOS.forEach(p => { const d = document.createElement('div'); d.className = 'pitem';
    const im = document.createElement('img'); im.src = p.data;
    const pt = document.createElement('div'); pt.className = 'pt'; pt.textContent = fmtT(p.t);
    const cap = document.createElement('input'); cap.type = 'text'; cap.placeholder = t.ph_cap; cap.value = p.cap || '';
    cap.addEventListener('change', async () => { p.cap = cap.value; await idb.put(p); });
    const del = document.createElement('button'); del.className = 'pdel'; del.textContent = t.ph_del;
    del.addEventListener('click', async () => { await idb.del(p.id); PHOTOS = PHOTOS.filter(x => x.id !== p.id); renderPhotos(); updateCount(); });
    d.appendChild(im); d.appendChild(pt); d.appendChild(cap); d.appendChild(del); g.appendChild(d); }); }
idb.open().then(async () => { PHOTOS = await idb.all(); PHOTOS.sort((a,b) => a.t.localeCompare(b.t)); renderPhotos(); updateCount(); }).catch(e => console.warn('idb', e));
document.getElementById('upzone').addEventListener('click', () => document.getElementById('upinput').click());
document.getElementById('upinput').addEventListener('change', async ev => {
  for (const f of ev.target.files) { const data = await shrink(f);
    const p = { id: Date.now() + '-' + Math.random().toString(36).slice(2,8), t: new Date().toISOString(), cap: '', data };
    await idb.put(p); PHOTOS.push(p); }
  ev.target.value = ''; renderPhotos(); updateCount(); });

function logGet(k){ const raw = store(k); if (!raw) return []; try { const a = JSON.parse(raw); return Array.isArray(a) ? a : [{t:new Date().toISOString(),text:String(raw)}]; } catch(e){ return [{t:new Date().toISOString(),text:raw}]; } }
function logSave(k,a){ save(k, JSON.stringify(a)); }
function fmtT(iso){ const d = new Date(iso); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function renderLog(k){ const el = document.querySelector('[data-log="'+k+'"]'); if (!el) return; const a = logGet(k); el.innerHTML=''; a.forEach(e => { const d = document.createElement('div'); d.className = 'centry' + (e.struck ? ' struck' : ''); const ct = document.createElement('span'); ct.className='ct'; ct.textContent = fmtT(e.t); const cx = document.createElement('span'); cx.className='cx'; cx.textContent = e.text; d.appendChild(ct); d.appendChild(cx); d.addEventListener('click', () => { e.struck = !e.struck; e.struckAt = e.struck ? new Date().toISOString() : undefined; logSave(k, a); renderLog(k); }); el.appendChild(d); }); }
document.querySelectorAll('[data-cadd]').forEach(b => { const k = b.dataset.cadd; renderLog(k); b.addEventListener('click', () => { const ta = document.querySelector('[data-cin="'+k+'"]'); const v = ta.value.trim(); if (!v) return; const a = logGet(k); a.push({t:new Date().toISOString(), text:v}); logSave(k, a); ta.value=''; renderLog(k); updateCount(); }); });

// add-buttons (Ideen)
document.querySelectorAll('.addbtn').forEach(b => {
  const k = b.dataset.add;
  const sync = () => { const on = store(k) === '1'; b.classList.toggle('on', on); b.querySelector('span').setAttribute('data-i', on ? 'added' : 'add'); };
  if (store(k) === '1') b.classList.add('on');
  b.addEventListener('click', () => { save(k, store(k) === '1' ? '' : '1'); sync(); applyLang(); updateCount(); });
  sync();
});

// reveal on scroll
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('vis'); }), { threshold: .08 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('vis')), 1200);

applyLang();
</script>
</body>
</html>
